name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/client

      # Publish the built client straight to the gh-pages branch.
      # No Actions artifacts involved, so the deployment can never hit
      # artifact-storage quota.
      - name: Publish to gh-pages
        run: |
          set -eu
          cd apps/client/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "AbdullahM07"
          git config user.email "mygithubacc7@gmail.com"
          git add -A
          git commit -q -m "Deploy: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
